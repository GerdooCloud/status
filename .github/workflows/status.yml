name: External status

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

concurrency:
  group: external-status
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore monitoring history
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin status-data > /tmp/status-ref
          result=$?
          set -e
          if [ "$result" = 0 ]; then
            git fetch origin status-data
            git worktree add --detach /tmp/status-state FETCH_HEAD
          elif [ "$result" = 2 ]; then
            git worktree add --detach /tmp/status-state HEAD
            git -C /tmp/status-state switch --orphan status-data
          else
            exit "$result"
          fi
      - run: python3 -m unittest -v test_monitor.py
      - name: Probe services and build static page
        run: python3 monitor.py --state /tmp/status-state/state.json --output public
      - name: Persist monitoring history
        run: |
          set -euo pipefail
          cd /tmp/status-state
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state.json
          git commit -m 'Record external status checks'
          git push origin HEAD:refs/heads/status-data
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public
  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
